services:
  # 1. FastAPI Web Service
  - type: web
    name: doc-extract-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: doc-extract-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: doc-extract-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://your-app-name.vercel.app
      - key: STORAGE_BACKEND
        value: local
      - key: OCR_PROVIDER
        value: tesseract
      - key: EXTRACTION_ENGINE
        value: rule_based

  # 2. Celery Background Worker
  - type: worker
    name: doc-extract-worker
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A app.workers.celery_app worker --loglevel=info"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: doc-extract-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: doc-extract-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: doc-extract-api
          envVarKey: SECRET_KEY
      - key: STORAGE_BACKEND
        value: local
      - key: OCR_PROVIDER
        value: tesseract
      - key: EXTRACTION_ENGINE
        value: rule_based

# 3. PostgreSQL Database
databases:
  - name: doc-extract-db
    region: oregon
    plan: free
    databaseName: doc_processing_db
    user: doc_user

# 4. Redis Key-Value Datastore
  - type: redis
    name: doc-extract-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
