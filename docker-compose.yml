version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: doc_processing_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: doc_processing_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. Redis Message Broker & State Cache
  redis:
    image: redis:7-alpine
    container_name: doc_processing_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 3. FastAPI Web Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc_processing_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/doc_processing_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=production_secret_key_change_in_real_deployment_12345
      - LOCAL_STORAGE_DIR=/app/data/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/data/uploads
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    restart: unless-stopped

  # 4. Asynchronous Celery Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc_processing_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/doc_processing_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=production_secret_key_change_in_real_deployment_12345
      - LOCAL_STORAGE_DIR=/app/data/uploads
    volumes:
      - uploads_data:/app/data/uploads
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    restart: unless-stopped

  # 5. Flower (Celery Monitoring Dashboard)
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc_processing_flower
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "5555:5555"
    command: celery -A app.workers.celery_app flower --port=5555
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
